<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For you</title>
<!-- Cute font from Google Fonts. Needs internet; offline it falls back to a system handwriting font. Delete this one line to stay fully offline. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
/* COLOURS & FONTS: change these 10 lines to restyle everything.
   Fonts use system fonts only (works offline). Put your favourite first in --hand / --serif. */
:root{--paper:#f6ecdd;--paper2:#efe0cb;--blush:#e9c5c2;--rose:#c4808a;--brown:#5b4236;--wine:#7a2338;--ink:#4a362c;
--hand:"Gaegu","Chalkboard SE","Marker Felt","Ink Free","Segoe Print","Comic Sans MS",cursive;--serif:Georgia,"Iowan Old Style",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--serif);overflow-x:hidden;
background-image:radial-gradient(rgba(91,66,54,.05) 1px,transparent 1.5px);background-size:7px 7px}
h2{font:700 2.2rem/1.2 var(--hand);color:var(--wine);margin:0 0 .3rem;transform:rotate(-1deg)}
.sub{margin:0 0 1.6rem;opacity:.75;font-style:italic}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.hand{font-family:var(--hand)}
section{max-width:860px;margin:0 auto;padding:4.5rem 1.2rem 2rem}
.btn{font-size:1.15rem;background:var(--wine);color:#fff7ef;border:0;padding:.7rem 1.3rem;border-radius:3px 12px 4px 10px;font-family:var(--hand);box-shadow:2px 3px 0 rgba(0,0,0,.18);transition:transform .15s}
.btn:hover{transform:rotate(-1.5deg) translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px dashed var(--wine);box-shadow:none}
.hidden{display:none!important}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--rose);width:0;z-index:50}
/* gate */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;text-align:center}
#gate .greet{font:700 2rem var(--hand);color:var(--wine);transform:rotate(-2deg)}
/* envelope component */
.ew{width:min(320px,100%);margin:0 auto 1.4rem}
.ew.big{width:min(420px,100%)}
.env{position:relative;display:block;width:100%;height:130px;border:0;border-radius:3px;background:linear-gradient(var(--blush),#dcaeb0);box-shadow:3px 5px 0 rgba(91,66,54,.18)}
.big .env{height:200px}
.env .flap{position:absolute;inset:0 0 auto 0;height:62%;background:#d79ea5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.env .lab{position:absolute;inset:auto 0 12px;font:1.25rem var(--hand);color:var(--brown);padding:0 .6rem}
.env .seal{position:absolute;left:50%;top:48%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b43a52,var(--wine));color:#f9d9d9;font-size:18px;line-height:34px;box-shadow:0 2px 3px rgba(0,0,0,.3);transition:opacity .3s}
.env.open .flap{transform:rotateX(180deg);background:#c78a92}.env.open .seal{opacity:0}
.note{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s ease}
.env.open+.note{grid-template-rows:1fr}
.note>div{overflow:hidden;min-height:0}
.paper{margin-top:.8rem;padding:1.4rem 1.3rem;background:#fffaf0 repeating-linear-gradient(transparent 0 29px,rgba(196,128,138,.25) 29px 30px);font:1.3rem/30px var(--hand);white-space:pre-line;box-shadow:2px 3px 0 rgba(91,66,54,.15);transform:rotate(.6deg);text-align:left;opacity:0;transition:opacity .9s .3s}
.env.open+.note .paper{opacity:1}
.sig{text-align:right;color:var(--wine)}
/* timeline */
.tl{position:relative;padding-left:1.4rem;border-left:2px dashed var(--rose)}
.ms{position:relative;margin:0 0 2.4rem}
.ms::before{content:"";position:absolute;left:-1.95rem;top:.6rem;width:12px;height:12px;border-radius:50%;background:var(--wine)}
.date{font:.95rem var(--hand);color:var(--rose)}
.ms h3{font:700 1.55rem var(--hand);margin:.1rem 0 .4rem}
.ms.small{max-width:300px;background:#fff3b8;padding:.8rem 1rem;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-2deg);margin-left:1.5rem}
.ms.small:nth-child(even){transform:rotate(2deg);margin-left:auto;background:#fadadd}
.ms.big{background:#fffaf0;padding:1.2rem;box-shadow:3px 4px 0 rgba(91,66,54,.15);border-radius:2px}
.story{display:none;margin:.6rem 0 0}.story.show{display:block}
.pic{width:100%;max-height:260px;object-fit:cover;display:block;margin:.5rem 0}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;padding:.8rem;border:2px dashed var(--rose);background:repeating-linear-gradient(45deg,#f3e3d6 0 8px,#f8ede2 8px 16px);font:.9rem var(--hand);color:var(--brown)}
.count{font:1rem var(--hand);color:var(--brown)}
/* garden */
#garden{position:relative;height:250px;background:linear-gradient(#fbeee8 0 70%,#7a5640 70%);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--paper2)}
.pl{position:absolute;bottom:20px;border:0;background:none;padding:0;transform-origin:50% 100%}
.pl svg{display:block;width:100%;height:auto;transform:scaleY(0);transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
.pl.grown svg{transform:scaleY(1)}
.pl .seed{position:absolute;left:50%;bottom:0;width:22px;height:11px;margin-left:-11px;border-radius:50% 50% 0 0;background:#5a3b2a;box-shadow:0 -3px 0 -1px #c7a15b;transition:opacity .4s}
.pl.grown .seed{opacity:0}
.pl.seen svg{filter:saturate(.6) brightness(1.05)}
#gnote{min-height:5.5rem;margin-top:1rem}
/* gift */
.giftwrap{text-align:center;min-height:330px;position:relative}
.gift{position:relative;width:170px;height:150px;margin:70px auto 0;border:0;background:none;padding:0}
.gbody{position:absolute;bottom:0;left:0;right:0;height:100px;background:var(--rose);box-shadow:3px 4px 0 rgba(0,0,0,.18)}
.gbody::after,.glid::after{content:"";position:absolute;left:50%;width:26px;margin-left:-13px;top:0;bottom:0;background:var(--wine)}
.glid{position:absolute;bottom:100px;left:-8px;right:-8px;height:34px;background:#d58f98;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-origin:left bottom;box-shadow:2px 3px 0 rgba(0,0,0,.15)}
.glid::before{content:"";position:absolute;left:50%;top:-18px;width:36px;height:20px;margin-left:-18px;border:6px solid var(--wine);border-radius:50% 50% 0 0}
.gift.open .glid{transform:translate(-30px,-60px) rotate(-28deg)}
.gtag{font:1.1rem var(--hand);color:var(--wine);margin-top:1.2rem}
#gout{max-width:420px;margin:1rem auto}
.cf{position:absolute;left:50%;top:150px;width:9px;height:12px;animation:pop 1.6s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
/* album */
.alb{display:flex;flex-wrap:wrap;gap:1.6rem;justify-content:center}
.pol{width:190px;background:#fff;padding:10px 10px 8px;border:0;box-shadow:2px 4px 8px rgba(0,0,0,.2);text-align:center;transition:transform .2s}
.pol:hover{transform:rotate(0) scale(1.04)!important}
.pol .ph,.pol img{height:170px;width:100%;object-fit:cover;min-height:0}
.pol span{display:block;font:1rem var(--hand);margin-top:.4rem}
#lb{position:fixed;inset:0;background:rgba(60,35,30,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem}
#lb .in{background:#fffaf0;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:1rem;text-align:center}
#lb img{max-width:100%;max-height:52vh;object-fit:contain}
#lb .row{display:flex;justify-content:space-between;margin-top:.8rem}
video{max-width:100%;margin-top:1.5rem}
/* scraps */
.scraps{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.scrap{border:0;padding:.7rem 1rem;font:1.2rem var(--hand);box-shadow:2px 2px 0 rgba(0,0,0,.14);clip-path:polygon(0 4%,96% 0,100% 94%,4% 100%)}
.scrap.on{outline:2px solid var(--wine)}
.ow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;align-items:start}
#lout{min-height:5rem;text-align:center;margin-top:1rem}
.hint{font-size:.95rem;opacity:.7}
.clock{display:flex;gap:1.3rem;justify-content:center;font:1.3rem var(--hand);color:var(--brown);flex-wrap:wrap}
.clock b{font-size:1.7rem;color:var(--wine)}
.final{margin-top:2rem;text-align:center}
#fin{margin-top:1.4rem}
#music{position:fixed;right:10px;bottom:10px;z-index:55;background:#fffaf0;padding:.4rem .7rem;border-radius:20px;box-shadow:2px 3px 0 rgba(0,0,0,.18);display:flex;gap:.5rem;align-items:center;font:.9rem var(--hand)}
#music button{border:0;background:var(--wine);color:#fff;border-radius:50%;width:32px;height:32px}
#music input{width:70px}
footer{text-align:center;padding:2rem 1rem 5rem}
.rv{opacity:0;transform:translateY(14px);transition:.8s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div>

<!-- Opening envelope -->
<header id="gate"><div id="gateInner"></div></header>

<main id="main" class="hidden"></main>

<div id="music" class="hidden"><button id="mbtn" aria-label="Play or pause music">&#9654;</button><label class="hidden" for="vol">vol</label><input id="vol" type="range" min="0" max="1" step=".05" value=".5" aria-label="Volume"></div>
<div id="lb" class="hidden" role="dialog" aria-modal="true" aria-label="Photo viewer"></div>
<footer id="foot" class="hidden"><button class="btn ghost" id="replay">Replay the opening</button></footer>

<script>
/* =====================================================================
   CONFIGURATION: edit ONLY this block. Everything on the page comes from here.
   HOW TO:
   1. Change text: edit the words between the quotes. Keep the quote marks and commas.
   2. Add photos: put files in an "images" folder next to index.html, then set src: "images/yourfile.jpg".
   3. Add videos: put them in "videos/" and set video.src (album) or "video" on a timeline item. Use .mp4.
   4. Add audio: put an .mp3 in "audio/" and set music.src: "audio/song.mp3".
   5. Add timeline events: copy one {...}, – paste after it with a comma. size "big" = large card, "small" = sticky note.
   6. Add flowers: copy a {...} in flowers. type: daisy, tulip, rose, sunflower or poppy.
   7. Hide a section: set it to false in "show".
   8. Colours and fonts: see the :root lines at the top of the CSS.
   9. Anniversary date: anniversaryDate "YYYY-MM-DDTHH:MM:SS" (leave "" to show a placeholder).
   10. More surprises: copy a {...} in surprises; set enabled false to switch one off.
   All the words below are SAMPLE text. Replace them with your own memories.
   ===================================================================== */
const CONFIG = {
  partnerName: "Your Love",      // <- put their name or nickname here
  yourName: "Your Name",         // <- and yours here
  anniversaryDate: "2025-10-18T00:00:00",
  anniversaryNumber: 1,
  title: "A year of us",
  gate: {
    greeting: "Hi, you.",
    line: "I made a little something for you.",
    sealIcon: "\u2665",
    letter: "I spent a few evenings on this and pretended I wasn't nervous.\n\nIt's not fancy. It's just a small place for some of the things I don't say out loud enough.\n\nTake your time with it.",
    button: "Come, let me show you something"
  },
  show: { story:true, letter:true, garden:true, gift:true, album:true, openWhen:true, loves:true, counter:true, next:true },
  effects: { reveal:true, confetti:true },
  music: { src: "", title: "Our song", startVolume: 0.5 },
  timeline: [
    { size:"big",   date:"The beginning", title:"Before I knew what this was", story:"I didn't know then that you'd become the person I tell everything to. I just remember not wanting the conversation to end, and being quietly pleased every time you wrote back.", photo:"images/timeline-1.jpg", video:"" },
    { size:"small", date:"Early on", title:"The conversation that ran late", story:"Somewhere in the middle of it I stopped trying to say the right thing and just said the true one. You didn't flinch. That's when it got easy." },
    { size:"small", date:"Somewhere in there", title:"When I knew", story:"There wasn't a big moment. It was a small one, an ordinary afternoon, and I thought: oh. It's you." },
    { size:"big",   date:"One of many", title:"The one we still laugh about", story:"Neither of us can tell it properly anymore. One of us starts, the other finishes it wrong, and then we're both gone. I hope we're still doing this when we're old.", photo:"images/timeline-4.jpg" },
    { size:"small", date:"A quiet night", title:"The sweetest thing you said", story:"You probably don't remember saying it. I do. I think about it more than you'd guess." },
    { size:"big",   date:"The hard stretch", title:"When it was difficult", story:"We had a hard patch and neither of us was at our best. What I remember most is that we both stayed, and that we kept talking until it was better. I trust us more because of it.", photo:"" },
    { size:"small", date:"Out of nowhere", title:"Feeling lucky", story:"Some days I look over and think, how did I end up with you? Then I decide not to question it and just be grateful." },
    { size:"big",   date:"My favourite", title:"If I could replay one day", story:"Nothing grand happened. We were just together, and nobody needed anything from us. It's the day I'd pick, and I'd happily live it again.", photo:"images/timeline-8.jpg" },
    { size:"small", date:"Next", title:"What I'm looking forward to", story:"More ordinary days with you. Slow mornings, bad jokes, and the plans we haven't made yet." }
  ],
  loveLetter: {
    label: "A letter, if you have a minute",
    greeting: "My favourite person,",
    body: "I'm better at writing things down than saying them, so here we are.\n\nThis year with you has been the calmest, happiest stretch I can remember. You make me feel like I can just be myself, and that's rarer than you'd think.\n\nThank you for the patience, the laughs, and the way you show up. I don't say it enough, so I'm saying it here.\n\nI'm really glad it's you.",
    closing: "Yours,",
    signature: "Your Name"
  },
  flowers: [
    { title:"Your laugh",      type:"sunflower", message:"It's the first thing I'd miss. It makes a bad day lighter before I even know why you're laughing." },
    { title:"How you care",    type:"rose",      message:"You notice things. The small stuff I mention once and forget, you remember. That's how I know you're really listening." },
    { title:"Your patience",   type:"tulip",     message:"You give me time when I'm figuring something out. You never make me feel slow for it." },
    { title:"Little habits",   type:"daisy",     message:"The tiny things you do without thinking. I notice every one, and they're a big part of why home feels like you." },
    { title:"Ordinary days",   type:"poppy",     message:"A normal Tuesday with you is better than most special occasions. I never want to stop having those." },
    { title:"Your kindness",   type:"daisy",     message:"It isn't for show. You're kind when nobody's watching, and I've learned a lot from that." },
    { title:"Your stubborn side", type:"tulip",  message:"Yes, even that. It means you care, and it means you'll never let me give up on something worth keeping." },
    { title:"One more",        type:"rose",      message:"There's a memory I keep for the quiet moments, the one we both know. I won't write it here. Ask me about it later." }
  ],
  surprises: [
    { enabled:true,  title:"A little promise", message:"This year, I promise to say the nice things out loud, not only think them. And to put my phone down more when you're talking." },
    { enabled:true,  title:"A favourite photo", message:"I like this one. It looks like us.", image:"images/surprise.jpg" },
    { enabled:true,  title:"A playlist for you", message:"Songs that sound like us. Press play when you're making tea.", link:"" },
    { enabled:false, title:"A voice note", message:"Press play, it's just me.", audio:"audio/voice-note.mp3" },
    { enabled:false, title:"A short video", message:"", video:"videos/surprise.mp4" }
  ],
  giftNote: "There's one more thing for you.",
  album: {
    photos: [
      { src:"images/memory-1.jpg", caption:"Us, as usual", date:"This year", story:"I love this because neither of us was trying to look good, and we do anyway." },
      { src:"images/memory-2.jpg", caption:"Caught mid-laugh", date:"This year", story:"I'd take a hundred of these over a posed one." },
      { src:"images/memory-3.jpg", caption:"A quiet one", date:"This year", story:"Not much happening here. That's exactly why I like it." },
      { src:"images/memory-4.jpg", caption:"Looking back", date:"This year", story:"Look how far we've come. I'd do it all again." }
    ],
    video: { src:"", caption:"A moving memory" }
  },
  openWhen: [
    { label:"Open when you miss me", note:"I miss you too, probably right now. Look at your phone, I'm likely about to message you. Until then: I'm thinking about you, and the next time we're together is closer than it feels." },
    { label:"Open when you need a smile", note:"Think of the thing that always sets us off. You know the one. Now say it out loud. You're welcome." },
    { label:"Open when it's a bad day", note:"You don't have to fix it today. Just breathe, drink some water, and know I'm on your side. Call me if you want, or don't, and I'll be here either way." },
    { label:"Open when you can't sleep", note:"Your mind is loud, but it's late and nothing has to be solved right now. Think of somewhere calm. Picture us there. I'll see you in the morning." },
    { label:"Open when you want to remember our first year", note:"Scroll back to the photos. We started as strangers who couldn't stop talking, and we're something much better now." },
    { label:"Open when you need to know what you mean to me", note:"A lot. More than I manage to say. You're the person I want to tell things to first, good or bad." },
    { label:"Open when you wonder what I dream about for us", note:"A home that feels like both of us. Lots of small trips. Being old and still bickering over silly things. I'd like that very much." }
  ],
  loves: [
    "The way you listen like there's nowhere else you'd rather be.",
    "How you remember the small things I mention once.",
    "Your laugh when something is funnier than it should be.",
    "That you check in on me, even when I say I'm fine.",
    "Your hands. I notice them more than I'd admit.",
    "How you get excited about other people's good news.",
    "The way you say my name when you're teasing me.",
    "Your sleepy voice in the morning.",
    "That you try new things even when you're nervous.",
    "How you make boring errands feel like a little outing.",
    "Your terrible jokes. I laugh at the delivery.",
    "How safe it feels to sit in silence with you.",
    "That you're honest with me, even when it's hard."
  ],
  next: {
    message: "That's one year. I don't know exactly what the next one holds, but I know I want to spend it with you. Here are a few things I'd like us to do.",
    promises: [
      { label:"Somewhere new", note:"A trip, big or small. Somewhere neither of us has been, with no strict plan." },
      { label:"Something small", note:"A little weekly thing that's only ours. Same time, same place, no phones." },
      { label:"Something brave", note:"One thing that scares us both a bit, done together." },
      { label:"Something silly", note:"Let's do something ridiculous and take a terrible photo of it." },
      { label:"A promise", note:"I'll keep choosing you, on the easy days and the harder ones." }
    ],
    buttonText: "One last thing",
    finalMessage: "Happy anniversary, my love.\n\nThank you for this year. I'm looking forward to every one after it.\n\nI love you.\n\nYour Name"
  }
};

/* ============ ENGINE: you shouldn't need to edit below this line ============ */
const $ = (s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arr=a=>Array.isArray(a)?a:[];
const C=CONFIG, main=$("#main");
const noMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.title=C.title||"For you";

/* Image with graceful placeholder if the file is missing */
function media(src,cls,label){
  const ph=()=>el("div","ph "+(cls||""),"Add your photo:<br>"+esc(src||label||"images/your-photo.jpg"));
  if(!src) return ph();
  const i=new Image(); i.src=src; i.alt=label||""; if(cls) i.className=cls;
  i.onerror=()=>i.replaceWith(ph()); return i;
}
/* Envelope + note component (used for gate, letter, open-when, promises) */
function envelope(label,paperHTML,big,seal,onOpen){
  const w=el("div","ew"+(big?" big":""));
  const b=el("button","env",'<span class="flap"></span><span class="seal" aria-hidden="true">'+esc(seal||"\u2665")+'</span><span class="lab">'+esc(label)+'</span>');
  b.setAttribute("aria-expanded","false");
  const n=el("div","note",'<div><div class="paper">'+paperHTML+'</div></div>');
  b.onclick=()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",o);if(o&&onOpen)onOpen()};
  w.append(b,n); w.toggle=()=>b.click(); w.btn=b; return w;
}
function sec(id,title,sub){
  const s=el("section"+(C.effects.reveal?"":""),null); s.id=id; if(C.effects.reveal) s.classList.add("rv");
  s.append(el("h2",null,esc(title))); if(sub) s.append(el("p","sub",esc(sub))); main.append(s); return s;
}

/* ---- Gate ---- */
function buildGate(){
  const g=C.gate, box=$("#gateInner"); box.innerHTML="";
  box.append(el("p","greet",esc(g.greeting)),el("p",null,esc(g.line)));
  const paper=esc(g.letter)+'<p class="sig"></p>';
  const e=envelope("For "+C.partnerName,paper,true,g.sealIcon);
  const go=el("button","btn",esc(g.button)); go.style.display="none"; go.style.marginTop="1rem";
  e.btn.onclick=()=>{const o=e.btn.classList.toggle("open");e.btn.setAttribute("aria-expanded",o);go.style.display=o?"inline-block":"none"};
  go.onclick=()=>{$("#gate").classList.add("hidden");main.classList.remove("hidden");$("#foot").classList.remove("hidden");if(C.music.src)$("#music").classList.remove("hidden");scrollTo(0,0);observe()};
  box.append(e,go); if(!e.btn.dataset.h){e.btn.dataset.h=1}
}

/* ---- Story ---- */
function buildStory(){
  const items=arr(C.timeline); const s=sec("story","Our first year","Tap a memory to read it.");
  const cnt=el("p","count"); const tl=el("div","tl"); let seen=0;
  const upd=()=>cnt.textContent="Memories opened: "+seen+" of "+items.length;
  items.forEach(m=>{
    const d=el("div","ms "+(m.size==="big"?"big":"small"));
    d.append(el("div","date",esc(m.date)),el("h3",null,esc(m.title)));
    if(m.size==="big"){ if(m.video){const v=el("video");v.src=m.video;v.controls=true;v.onerror=()=>v.remove();d.append(v)} else d.append(media(m.photo,"pic","Photo")) }
    const st=el("p","story",esc(m.story)); const b=el("button","btn ghost","Read this one"); let first=true;
    b.onclick=()=>{const o=st.classList.toggle("show");b.textContent=o?"Fold it back":"Read this one";if(o&&first){first=false;seen++;upd()}};
    d.append(b,st); tl.append(d);
  });
  upd(); s.append(cnt,tl);
}

/* ---- Letter ---- */
function buildLetter(){
  const L=C.loveLetter,s=sec("letter","A letter");
  const html=esc(L.greeting)+"\n\n"+esc(L.body)+"\n\n"+esc(L.closing)+'\n<span class="sig" style="display:block">'+esc(L.signature)+"</span>";
  const e=envelope(L.label||"Open me",html,true,"\u2665"); s.append(e);
  const c=el("button","btn ghost","Close and open again"); c.onclick=()=>e.toggle(); s.append(c);
}

/* ---- Garden ---- */
const PET={daisy:["#fff","#f2c230",8],sunflower:["#f4b92c","#6b4423",12],poppy:["#d9382f","#2b1b17",5],rose:["#a3243d","#7a1730",7],tulip:["#e98aa7","#c4568a",3]};
function flowerSVG(t){
  const p=PET[t]||PET.daisy; let g="";
  if(t==="tulip") g='<path d="M18 36 Q16 12 30 10 Q44 12 42 36 Q30 44 18 36Z" fill="'+p[0]+'"/><path d="M30 10 L24 30 L36 30Z" fill="'+p[1]+'" opacity=".5"/>';
  else{ for(let i=0;i<p[2];i++) g+='<ellipse cx="30" cy="16" rx="'+(t==="rose"?9:5)+'" ry="'+(t==="rose"?9:11)+'" fill="'+p[0]+'" transform="rotate('+(360/p[2]*i)+' 30 30)"/>'; g+='<circle cx="30" cy="30" r="'+(t==="rose"?7:6)+'" fill="'+p[1]+'"/>'; }
  return '<svg viewBox="0 0 60 120" aria-hidden="true"><path d="M30 44 Q27 80 30 120" stroke="#5f8a4f" stroke-width="3" fill="none"/><path d="M30 90 Q12 78 10 66 Q26 70 30 90Z" fill="#6f9a5c"/><path d="M30 76 Q48 66 52 56 Q34 58 30 76Z" fill="#7aa866"/>'+g+'</svg>';
}
function buildGarden(){
  const f=arr(C.flowers); const s=sec("garden","Growing with you","Tap a seed to plant it. Tap the flower to read what it says.");
  const g=el("div"); g.id="garden"; const note=el("div","paper"); note.id="gnote"; note.style.opacity=1;
  note.textContent="Nothing planted yet."; let found=0; const total=f.length;
  f.forEach((fl,i)=>{
    const w=60+((i*37)%24), left=(i+.5)/Math.max(total,1)*100;
    const b=el("button","pl",'<span class="seed"></span>'+flowerSVG(fl.type)); b.setAttribute("aria-label",fl.title+" (seed)");
    b.style.cssText="left:calc("+left.toFixed(1)+"% - "+(w/2)+"px);width:"+w+"px;transform:rotate("+(((i*53)%9)-4)+"deg)";
    let grown=false,seen=false; b.style.height=(w*2)+"px";
    b.onclick=()=>{
      if(!grown){grown=true;b.classList.add("grown");b.setAttribute("aria-label",fl.title);return}
      note.innerHTML="<b>"+esc(fl.title)+"</b>\n"+esc(fl.message); b.classList.add("seen");
      if(!seen){seen=true;found++} if(found===total) note.innerHTML+="\n\nThat's every flower. You found them all.";
      else cnt.textContent="Flowers read: "+found+" of "+total;
    };
    g.append(b);
  });
  const cnt=el("p","count","Flowers read: 0 of "+total);
  s.append(g,cnt,note); if(!total) note.textContent="No flowers yet. Add some in CONFIG.flowers.";
}

/* ---- Gift ---- */
function buildGift(){
  const list=arr(C.surprises).filter(x=>x&&x.enabled); const s=sec("gift","One more thing");
  const w=el("div","giftwrap"); const b=el("button","gift",'<span class="gbody"></span><span class="glid"></span>'); b.setAttribute("aria-label","Gift box. Tap to open");
  const tag=el("p","gtag",esc(C.giftNote)); const out=el("div"); out.id="gout"; let open=false;
  b.onclick=()=>{open=!open;b.classList.toggle("open",open);out.innerHTML="";
    if(open){ if(C.effects.confetti&&!noMotion) confetti(w);
      list.forEach(x=>{const p=el("div","paper","<b>"+esc(x.title)+"</b>\n"+esc(x.message)); p.style.opacity=1; p.style.marginBottom=".8rem";
        if(x.image)p.prepend(media(x.image,"pic","")); 
        if(x.video){const v=el("video");v.src=x.video;v.controls=true;v.onerror=()=>v.remove();p.append(v)}
        if(x.audio){const a=el("audio");a.src=x.audio;a.controls=true;p.append(a)}
        if(x.link){const l=el("a",null,"Open the playlist");l.href=x.link;l.target="_blank";l.rel="noopener";p.append(l)}
        out.append(p)});
      if(!list.length) out.append(el("p",null,"No surprises switched on yet."));}
    tag.textContent=open?"Look what's inside.":C.giftNote; reset.style.display=open?"inline-block":"none"};
  const reset=el("button","btn ghost","Close the box"); reset.style.display="none"; reset.onclick=()=>b.click();
  w.append(b,tag,out,reset); s.append(w);
}
function confetti(w){const cols=["#c4808a","#e9c5c2","#7a2338","#e0b24a"];
  for(let i=0;i<22;i++){const c=el("span","cf");c.style.background=cols[i%4];c.style.cssText+=";--x:"+((Math.random()-.5)*300)+"px;--y:"+(-80-Math.random()*130)+"px;--r:"+(Math.random()*540)+"deg;background:"+cols[i%4];w.append(c);setTimeout(()=>c.remove(),1700)}}

/* ---- Album + lightbox ---- */
let ci=0; const P=()=>arr(C.album.photos);
function lightbox(i){
  const ps=P(); if(!ps.length)return; ci=(i+ps.length)%ps.length; const p=ps[ci],lb=$("#lb"); lb.innerHTML="";
  const in_=el("div","in"); in_.append(media(p.src,"","Photo"),el("p","hand","<b>"+esc(p.caption)+"</b> "+esc(p.date)),el("p",null,esc(p.story)));
  const row=el("div","row"),pv=el("button","btn ghost","Previous"),nx=el("button","btn ghost","Next"),cl=el("button","btn","Close");
  pv.onclick=()=>lightbox(ci-1);nx.onclick=()=>lightbox(ci+1);cl.onclick=closeLb; row.append(pv,cl,nx); in_.append(row); lb.append(in_); lb.classList.remove("hidden"); cl.focus();
}
function closeLb(){$("#lb").classList.add("hidden")}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
addEventListener("keydown",e=>{if($("#lb").classList.contains("hidden"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")lightbox(ci+1);if(e.key==="ArrowLeft")lightbox(ci-1)});
function buildAlbum(){
  const s=sec("album","Our little photo album","Tap a polaroid for the story."); const a=el("div","alb");
  P().forEach((p,i)=>{const b=el("button","pol");b.append(media(p.src,"","Photo"),el("span",null,esc(p.caption)));
    b.style.transform="rotate("+(((i*7)%9)-4)+"deg)";b.onclick=()=>lightbox(i);a.append(b)});
  s.append(a); const v=C.album.video; if(v&&v.src){const vi=el("video");vi.src=v.src;vi.controls=true;vi.onerror=()=>vi.replaceWith(el("p","hint","Add your video: "+esc(v.src)));s.append(el("p","hand",esc(v.caption)),vi)}
}

/* ---- Open when ---- */
function buildOpenWhen(){
  const s=sec("openwhen","Open when\u2026"); const g=el("div","ow");
  arr(C.openWhen).forEach(o=>g.append(envelope(o.label,esc(o.note),false,"\u2665"))); s.append(g);
}

/* ---- Things I love ---- */
function buildLoves(){
  const s=sec("loves","A little collection of things I love about you","Tap a scrap."); const w=el("div","scraps"),out=el("div","paper"); out.id="lout"; out.style.opacity=1; out.textContent="Pick one."; let cur=null;
  const cols=["#fff3b8","#fadadd","#e4efe0","#e7e1f3","#fde5cf"];
  arr(C.loves).forEach((t,i)=>{const b=el("button","scrap",esc("No. "+(i+1)));b.style.background=cols[i%5];b.style.transform="rotate("+(((i*5)%9)-4)+"deg)";
    b.onclick=()=>{if(cur)cur.classList.remove("on");b.classList.add("on");cur=b;out.textContent=t};w.append(b)});
  s.append(w,out);
}

/* ---- Counter ---- */
function buildCounter(){
  const s=sec("counter","Time so far"); const c=el("div","clock"); s.append(c);
  const d=new Date(C.anniversaryDate);
  if(!C.anniversaryDate||isNaN(d)){c.textContent="Set anniversaryDate in CONFIG and I'll start counting.";return}
  const tick=()=>{let ms=Date.now()-d; if(ms<0){c.textContent="It starts on "+d.toLocaleDateString()+". Not long now.";return}
    const t=Math.floor(ms/1000),dd=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),sc=t%60;
    c.innerHTML="<span><b>"+dd+"</b> days</span><span><b>"+h+"</b> hours</span><span><b>"+m+"</b> minutes</span><span><b>"+sc+"</b> seconds</span>"};
  tick(); setInterval(tick,1000);
}

/* ---- Next chapter ---- */
function buildNext(){
  const N=C.next,s=sec("next","Our next chapter"); s.append(el("p",null,esc(N.message)));
  const g=el("div","ow"); arr(N.promises).forEach(p=>g.append(envelope(p.label,esc(p.note),false,"\u2605"))); s.append(g);
  const f=el("div","final"),b=el("button","btn",esc(N.buttonText)),out=el("div","paper");out.id="fin";out.style.opacity=1;out.classList.add("hidden");out.textContent=N.finalMessage;
  b.onclick=()=>{out.classList.toggle("hidden");if(!out.classList.contains("hidden")&&C.effects.confetti&&!noMotion)confetti(f);f.style.position="relative"};
  const r=el("button","btn ghost","Back to the beginning");r.style.marginTop="1rem";r.onclick=restart;f.append(b,out,r);s.append(f);
}

/* ---- Music ---- */
function buildMusic(){
  const a=new Audio(); a.loop=true; const btn=$("#mbtn"),vol=$("#vol"); if(!C.music.src)return; a.src=C.music.src; a.volume=C.music.startVolume;vol.value=a.volume;
  btn.onclick=()=>{ if(a.paused){a.play().then(()=>btn.innerHTML="&#10074;&#10074;").catch(()=>{btn.title="Audio file not found"})} else{a.pause();btn.innerHTML="&#9654;"} };
  vol.oninput=()=>a.volume=vol.value; vol.previousElementSibling.classList.remove("hidden"); btn.title=C.music.title;
}

/* ---- Misc ---- */
function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".rv").forEach(x=>io.observe(x));
}
addEventListener("scroll",()=>{const h=document.documentElement;$("#bar").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%"},{passive:true});
function restart(){main.classList.add("hidden");$("#foot").classList.add("hidden");buildGate();$("#gate").classList.remove("hidden");scrollTo(0,0)}
$("#replay").onclick=restart;

/* ---- Build the page; each section is wrapped so one error can't break the rest ---- */
const SEC={story:buildStory,letter:buildLetter,garden:buildGarden,gift:buildGift,album:buildAlbum,openWhen:buildOpenWhen,loves:buildLoves,counter:buildCounter,next:buildNext};
Object.keys(SEC).forEach(k=>{ if(C.show[k]!==false){ try{SEC[k]()}catch(e){console.warn("Section "+k+" failed:",e)} } });
buildGate(); buildMusic();
</script>
</body>
</html>
